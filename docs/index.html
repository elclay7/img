<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>img — Repositorio de imágenes y GIFs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface-hover: #252525;
      --text: #ffffff;
      --text-muted: #a0a0a0;
      --accent: #8c5cff;
      --accent-hover: #a37fff;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 15, 15, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .header-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo span {
      background: linear-gradient(135deg, var(--accent), #ff56a1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      box-shadow: var(--shadow);
      cursor: pointer;
      transform: translateZ(0);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }

    .card img,
    .card video {
      display: block;
      width: 100%;
      height: 220px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover img,
    .card:hover video {
      transform: scale(1.05);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.6) 100%);
      opacity: 0;
      transition: opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card:hover .overlay {
      opacity: 1;
    }

    .copy-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.95);
      color: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transform: translateY(10px);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .card:hover .copy-btn {
      transform: translateY(0);
    }

    .copy-btn:hover {
      background: #fff;
      transform: scale(1.1);
    }

    .copy-btn svg {
      width: 24px;
      height: 24px;
    }

    .filename {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.85);
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.7));
      opacity: 0;
      transition: opacity 0.2s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card:hover .filename {
      opacity: 1;
    }

    .empty {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .empty h2 {
      margin: 0 0 8px;
      color: var(--text);
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface);
      color: var(--text);
      padding: 14px 24px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast svg {
      width: 18px;
      height: 18px;
      color: #3ddc84;
    }

    @media (max-width: 640px) {
      .header-inner {
        gap: 16px;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }

      .card img,
      .card video {
        height: 160px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="logo" href="./" aria-label="Inicio">
        <span>img</span>.repo
      </a>
    </div>
  </header>

  <main>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty" style="display: none;">
      <h2>No hay imágenes aún</h2>
      <p>Agrega archivos a la carpeta <code>img/</code> y haz push a <code>main</code>.</p>
    </div>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span>Link copiado al portapapeles</span>
  </div>

  <script>
    const IMAGES = /* IMAGES_PLACEHOLDER */[
  {
    "name": "alert.gif",
    "url": "img/alert.gif",
    "type": "image/gif"
  },
  {
    "name": "beme1.png",
    "url": "img/beme1.png",
    "type": "image/png"
  },
  {
    "name": "beme2.png",
    "url": "img/beme2.png",
    "type": "image/png"
  },
  {
    "name": "smart.gif",
    "url": "img/smart.gif",
    "type": "image/gif"
  },
  {
    "name": "success.png",
    "url": "img/success.png",
    "type": "image/png"
  },
  {
    "name": "terminator-look.gif",
    "url": "img/terminator-look.gif",
    "type": "image/gif"
  },
  {
    "name": "terminator.png",
    "url": "img/terminator.png",
    "type": "image/png"
  },
  {
    "name": "terminator1.png",
    "url": "img/terminator1.png",
    "type": "image/png"
  },
  {
    "name": "terminator2.png",
    "url": "img/terminator2.png",
    "type": "image/png"
  },
  {
    "name": "terminator2_t1000-nope.gif",
    "url": "img/terminator2_t1000-nope.gif",
    "type": "image/gif"
  },
  {
    "name": "terminator_thumbs_up.gif",
    "url": "img/terminator_thumbs_up.gif",
    "type": "image/gif"
  },
  {
    "name": "thisisfine.gif",
    "url": "img/thisisfine.gif",
    "type": "image/gif"
  },
  {
    "name": "typingcat.gif",
    "url": "img/typingcat.gif",
    "type": "image/gif"
  }
]/* IMAGES_PLACEHOLDER */;
  </script>
  <script>
    (function () {
      const grid = document.getElementById("grid");
      const empty = document.getElementById("empty");
      const toast = document.getElementById("toast");

      const images = Array.isArray(window.IMAGES) ? window.IMAGES : [];
      console.log("[img repo] loaded images:", images.length, images);

      function getAbsoluteUrl(path) {
        return new URL(path, window.location.href).href;
      }

      function showToast() {
        toast.classList.add("show");
        clearTimeout(showToast.timeout);
        showToast.timeout = setTimeout(() => toast.classList.remove("show"), 2200);
      }

      async function copyLink(url, event) {
        event.stopPropagation();
        const absoluteUrl = getAbsoluteUrl(url);
        try {
          await navigator.clipboard.writeText(absoluteUrl);
          showToast();
        } catch (err) {
          const textarea = document.createElement("textarea");
          textarea.value = absoluteUrl;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand("copy");
            showToast();
          } catch (_) {
            window.open(absoluteUrl, "_blank");
          }
          document.body.removeChild(textarea);
        }
      }

      function createCard(image) {
        const card = document.createElement("div");
        card.className = "card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-label", image.name);

        const isVideo = image.type && image.type.startsWith("video/");
        const media = document.createElement(isVideo ? "video" : "img");
        media.src = image.url;
        media.alt = image.name;
        if (isVideo) {
          media.autoplay = true;
          media.loop = true;
          media.muted = true;
          media.playsInline = true;
        } else {
          media.loading = "lazy";
        }

        const overlay = document.createElement("div");
        overlay.className = "overlay";

        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-btn";
        copyBtn.type = "button";
        copyBtn.setAttribute("aria-label", "Copiar link de " + image.name);
        copyBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
        `;
        copyBtn.addEventListener("click", (e) => copyLink(image.url, e));

        const filename = document.createElement("div");
        filename.className = "filename";
        filename.textContent = image.name;

        overlay.appendChild(copyBtn);
        card.appendChild(media);
        card.appendChild(overlay);
        card.appendChild(filename);

        // Click en la tarjeta también abre la imagen
        card.addEventListener("click", () => {
          window.open(image.url, "_blank");
        });

        // Enter/Space en tarjeta enfocada
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            window.open(image.url, "_blank");
          }
        });

        return card;
      }

      function render(items) {
        grid.innerHTML = "";
        if (images.length === 0) {
          empty.style.display = "block";
          grid.style.display = "none";
          return;
        }

        empty.style.display = "none";
        grid.style.display = "grid";
        items.forEach((image) => grid.appendChild(createCard(image)));
      }

      render(images);
    })();
  </script>
</body>
</html>
